<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Trust Spectrum — The French Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Lenis smooth scroll -->
<script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

<style>
/* ══════════════════════════════════════
   TOKENS
══════════════════════════════════════ */
:root {
  --black:   #05050a;
  --off-w:   #f0ede4;
  --warm-w:  #e2ddd0;
  --grey:    #58564e;
  --dim:     rgba(240,237,228,0.45);
  --gold:    #c8b89a;
  --gold-dk: #8a7a62;
  --red:     #c8342a;
  --dot-in:  #e8724a;
  --dot-cit: #7b8fe0;
  --dot-hum: #4db890;
  --fd: 'Cormorant Garamond', Georgia, serif;
  --fm: 'DM Mono', monospace;
  --fb: 'DM Sans', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{background:var(--black);color:var(--off-w);font-family:var(--fb);overflow-x:hidden;}

/* ══════════════════════════════════════
   PROGRESS BAR
══════════════════════════════════════ */
#pb{
  position:fixed;top:0;left:0;height:2px;width:0%;
  background:linear-gradient(90deg,var(--dot-in),var(--dot-cit),var(--dot-hum));
  z-index:500;pointer-events:none;transition:width .08s linear;
}

/* ══════════════════════════════════════
   LANG TOGGLE
══════════════════════════════════════ */
#lang-bar{
  position:fixed;top:0;left:0;right:0;z-index:400;
  display:flex;justify-content:flex-end;padding:16px 20px;
  background:linear-gradient(to bottom,rgba(5,5,10,.9) 0%,transparent 100%);
  pointer-events:none;
}
#lang-toggle{
  display:flex;border:1px solid rgba(200,184,154,.3);border-radius:3px;
  overflow:hidden;pointer-events:all;
}
.lb{
  background:transparent;border:none;padding:6px 14px;
  font-family:var(--fm);font-size:10px;letter-spacing:.15em;
  color:var(--grey);cursor:pointer;transition:all .2s;
}
.lb.on{background:var(--gold);color:var(--black);}

/* ══════════════════════════════════════
   TIMELINE
══════════════════════════════════════ */
#tl{
  position:fixed;left:20px;top:50%;transform:translateY(-50%);
  z-index:300;display:flex;flex-direction:column;align-items:flex-start;
}
.tl-i{display:flex;flex-direction:column;align-items:flex-start;position:relative;}
.tl-d{
  width:7px;height:7px;border-radius:50%;
  border:1.5px solid rgba(200,184,154,.2);background:transparent;
  transition:all .4s;flex-shrink:0;
}
.tl-d.on{border-color:var(--gold);background:var(--gold);box-shadow:0 0 8px rgba(200,184,154,.4);}
.tl-d.done{border-color:rgba(200,184,154,.35);background:rgba(200,184,154,.15);}
.tl-c{width:1px;height:44px;margin-left:3px;background:rgba(200,184,154,.12);position:relative;overflow:hidden;}
.tl-cf{position:absolute;top:0;left:0;right:0;height:0%;background:var(--gold);transition:height .5s ease;}
.tl-l{
  position:absolute;left:16px;top:-2px;
  font-family:var(--fm);font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(200,184,154,.2);white-space:nowrap;transition:color .4s;pointer-events:none;
}
.tl-l.on{color:var(--gold);}
@media(max-width:600px){#tl{left:10px;}.tl-l{display:none;}.tl-c{height:30px;}}

/* ══════════════════════════════════════
   GLOBAL FILM GRAIN + VIGNETTE
══════════════════════════════════════ */
#grain{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
  background-size:256px;opacity:.45;mix-blend-mode:overlay;
}
#vignette{
  position:fixed;inset:0;z-index:199;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 25%,rgba(5,5,10,.75) 100%);
}

/* ══════════════════════════════════════
   FULLSCREEN SCENES (Hook, Lesson, Handoff)
══════════════════════════════════════ */
.fs{
  position:relative;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:90px 72px;overflow:hidden;
}
@media(max-width:600px){.fs{padding:80px 24px 80px 48px;}}

.fs-bg{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  transition:opacity 1s ease;
}
.fs-bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(5,5,10,.72);
}

.fs-inner{position:relative;z-index:10;max-width:700px;width:100%;}

/* ── text reveal: tied to scroll not auto ── */
.sr{
  opacity:0;transform:translateY(22px);
  transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);
}
.sr.in{opacity:1;transform:translateY(0);}
.sr.out{opacity:0;transform:translateY(-14px);transition-duration:.3s;}
.sr[data-d="1"]{transition-delay:.1s;}
.sr[data-d="2"]{transition-delay:.22s;}
.sr[data-d="3"]{transition-delay:.36s;}
.sr[data-d="4"]{transition-delay:.52s;}
.sr[data-d="5"]{transition-delay:.70s;}

/* ── hook typography ── */
.overline{
  font-family:var(--fm);font-size:9px;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(200,184,154,.45);margin-bottom:2rem;display:block;
}
.h-giant{
  font-family:var(--fd);font-size:clamp(2.2rem,5.5vw,4.4rem);
  font-weight:300;font-style:italic;line-height:1.18;
  color:var(--off-w);margin-bottom:.55em;
}
.h-giant em{font-style:normal;font-weight:700;color:var(--gold);}
.h-sub{
  font-family:var(--fd);font-size:clamp(1.05rem,2.4vw,1.4rem);
  font-weight:300;font-style:italic;color:var(--dim);line-height:1.6;
}

/* scroll cue */
.scroll-cue{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;
}
.scroll-cue span{font-family:var(--fm);font-size:8px;letter-spacing:.35em;text-transform:uppercase;color:var(--grey);}
.sc-line{
  width:1px;height:36px;
  background:linear-gradient(to bottom,var(--grey),transparent);
  animation:scAnim 2s ease-in-out infinite;
}
@keyframes scAnim{0%,100%{opacity:.5;transform:scaleY(1)}50%{opacity:.1;transform:scaleY(.3)}}

/* ── lesson typography ── */
.l-line{
  font-family:var(--fd);font-size:clamp(1.3rem,3.2vw,2rem);
  font-weight:300;font-style:italic;line-height:1.65;
  color:var(--off-w);margin-bottom:.55em;
}
.l-line em{font-style:normal;font-weight:700;color:var(--dot-in);}
.l-q{
  font-family:var(--fd);font-size:clamp(1.2rem,2.8vw,1.75rem);
  font-weight:400;font-style:italic;color:var(--gold);
  border-top:1px solid rgba(200,184,154,.12);padding-top:1.4em;margin-top:.4em;
  line-height:1.5;
}

/* ── handoff ── */
.hf-t{
  font-family:var(--fd);font-size:clamp(2rem,5.5vw,4rem);
  font-weight:700;line-height:1.05;color:var(--off-w);margin-bottom:.8rem;
}
.hf-b{font-family:var(--fb);font-size:.9rem;color:var(--dim);line-height:1.75;margin-bottom:1.8rem;}
.pips{display:flex;gap:6px;margin-bottom:1.4rem;}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(200,184,154,.18);}
.pip.on{background:var(--gold);}
.go-btn{
  display:inline-flex;align-items:center;gap:10px;padding:14px 28px;
  border:1.5px solid var(--gold);border-radius:3px;background:transparent;
  color:var(--off-w);font-family:var(--fm);font-size:11px;
  letter-spacing:.15em;text-transform:uppercase;cursor:pointer;
  text-decoration:none;transition:all .25s;
}
.go-btn:hover{background:var(--gold);color:var(--black);}
.go-arr{transition:transform .2s;}
.go-btn:hover .go-arr{transform:translateX(5px);}

/* ══════════════════════════════════════
   EXHIBIT CHAPTERS
   Sticky artifact + scrolling annotations
══════════════════════════════════════ */
.ch{position:relative;}/* height set by JS */

.sticky-stage{
  position:sticky;top:0;height:100vh;overflow:hidden;
}

/* full-bleed chapter background image */
.ch-bg{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
}
.ch-bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(5,5,10,.65);
}

/* ── central artifact ── */
.artifact-frame{
  position:absolute;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.artifact-img{
  max-height:78vh;max-width:48vw;
  width:auto;height:auto;object-fit:contain;
  filter:sepia(.3) contrast(.88) brightness(.8);
  box-shadow:0 0 120px rgba(0,0,0,.9),0 0 40px rgba(0,0,0,.7);
  border:1px solid rgba(200,184,154,.07);
  animation:artFloat 9s ease-in-out infinite;
  transform-origin:center;
}
@keyframes artFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:768px){.artifact-img{max-width:82vw;max-height:42vh;}}

/* side images */
.side-img{
  position:absolute;z-index:15;
  width:clamp(110px,14vw,200px);height:auto;
  object-fit:cover;
  filter:sepia(.45) contrast(.82) brightness(.65);
  border:1px solid rgba(200,184,154,.1);
  box-shadow:0 8px 40px rgba(0,0,0,.75);
  opacity:0;transform:scale(.94);
  transition:opacity .5s ease,transform .5s ease;
  aspect-ratio:4/3;
}
.side-img.show{opacity:1;transform:scale(1);}
.side-left{left:5%;top:50%;transform:translateY(-50%) scale(.94);}
.side-left.show{transform:translateY(-50%) scale(1);}
.side-right{right:5%;top:50%;transform:translateY(-50%) scale(.94);}
.side-right.show{transform:translateY(-50%) scale(1);}

/* ── spotlight ── */
.spotlight{
  position:absolute;z-index:20;border-radius:50%;
  background:radial-gradient(ellipse,rgba(200,184,154,.16) 0%,transparent 68%);
  pointer-events:none;opacity:0;
  transition:opacity .5s ease,left .7s cubic-bezier(.22,1,.36,1),top .7s cubic-bezier(.22,1,.36,1),width .5s,height .5s;
}
.spotlight.on{opacity:1;}

/* ── annotation card ── */
.anno-layer{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:flex-end;
  padding:80px 5% 80px 52%;pointer-events:none;
}
@media(max-width:768px){
  .anno-layer{padding:auto 5% 24px 5%;align-items:flex-end;}
}
.anno-card{
  max-width:400px;width:100%;
  opacity:0;transform:translateX(28px);
  transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1);
  pointer-events:all;
}
.anno-card.on{opacity:1;transform:translateX(0);}

.anno-inner{
  background:rgba(5,5,10,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(200,184,154,.11);border-radius:6px;
  padding:26px 26px 22px;position:relative;overflow:hidden;
}
.anno-inner::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,184,154,.28),transparent);
}

.a-tag{
  font-family:var(--fm);font-size:8px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold);margin-bottom:11px;display:flex;align-items:center;gap:8px;
}
.a-tag::after{content:'';flex:1;height:1px;background:rgba(200,184,154,.13);}

.a-head{
  font-family:var(--fd);font-size:clamp(1.4rem,2.8vw,2rem);
  font-weight:600;line-height:1.12;color:var(--off-w);margin-bottom:11px;
}
.a-head em{font-style:italic;font-weight:300;color:var(--gold);}
.a-head strong{color:var(--dot-in);}

.a-body{font-family:var(--fb);font-size:.82rem;line-height:1.72;color:var(--dim);margin-bottom:14px;}
.a-fact{
  font-family:var(--fm);font-size:.7rem;
  color:rgba(200,184,154,.42);border-top:1px solid rgba(200,184,154,.09);
  padding-top:11px;line-height:1.65;
}

/* ── score block inside anno ── */
.sc-block{margin-top:6px;}
.sc-row{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.sc-lbl{font-family:var(--fm);font-size:8px;letter-spacing:.13em;text-transform:uppercase;min-width:76px;}
.sc-lbl.in{color:var(--dot-in);}
.sc-lbl.cit{color:var(--dot-cit);}
.sc-lbl.hum{color:var(--dot-hum);}
.sc-num{font-family:var(--fm);font-size:1.15rem;font-weight:500;min-width:28px;text-align:right;}
.sc-num.in{color:var(--dot-in);}
.sc-num.cit{color:var(--dot-cit);}
.sc-num.hum{color:var(--dot-hum);}
.sc-trk{flex:1;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.sc-fill{height:100%;width:0%;border-radius:2px;transition:width 1.4s cubic-bezier(.22,1,.36,1);}
.sc-fill.in{background:linear-gradient(90deg,rgba(232,114,74,.3),var(--dot-in));}
.sc-fill.cit{background:linear-gradient(90deg,rgba(123,143,224,.3),var(--dot-cit));}
.sc-fill.hum{background:linear-gradient(90deg,rgba(77,184,144,.3),var(--dot-hum));}
.sc-delta{
  font-family:var(--fm);font-size:.62rem;padding:1px 6px;border-radius:2px;
}
.sc-delta.neg{background:rgba(200,50,50,.12);color:#e05555;border:1px solid rgba(200,50,50,.2);}
.sc-delta.pos{background:rgba(77,184,144,.12);color:var(--dot-hum);border:1px solid rgba(77,184,144,.2);}

/* dot defs */
.dot-defs{display:flex;flex-direction:column;gap:1.1rem;margin-top:6px;}
.dd-item{display:flex;gap:.9rem;align-items:flex-start;}
.dd-circ{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dd-circ.in{background:var(--dot-in);box-shadow:0 0 8px rgba(232,114,74,.4);}
.dd-circ.cit{background:var(--dot-cit);box-shadow:0 0 8px rgba(123,143,224,.4);}
.dd-circ.hum{background:var(--dot-hum);box-shadow:0 0 8px rgba(77,184,144,.4);}
.dd-name{font-family:var(--fm);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:2px;}
.dd-def{font-family:var(--fd);font-size:1.05rem;font-style:italic;font-weight:300;line-height:1.35;}

/* names list */
.names{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.name-row{display:flex;align-items:baseline;gap:8px;font-family:var(--fm);font-size:.72rem;color:var(--dim);}
.name-dt{color:var(--grey);min-width:64px;font-size:.65rem;}
.name-nm{}
.name-row.x .name-nm{text-decoration:line-through;text-decoration-color:rgba(200,50,50,.45);color:rgba(200,184,154,.28);}
.name-row.hi{color:var(--dot-in);font-weight:500;}
.name-note{font-size:.6rem;color:var(--grey);margin-left:4px;}

/* ══════════════════════════════════════
   MAP CHAPTER
══════════════════════════════════════ */
.map-art{
  position:absolute;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.map-wrap{
  width:min(52vw,500px);height:auto;
  filter:sepia(.55) contrast(.82) brightness(.68);
  animation:artFloat 9s ease-in-out infinite;
}
.map-wrap svg{width:100%;height:auto;}

/* SVG map styles */
.fr-land{fill:#c9b07a;stroke:#7a6040;stroke-width:1.2;}
.fr-sea{fill:#5a6a7a;opacity:.5;}
.fr-hatch{stroke:#7a6040;stroke-width:.35;opacity:.18;}
.m-lbl{font-family:Georgia,serif;font-size:10px;fill:#2a1a0a;opacity:.75;font-style:italic;}
.m-lbl.enemy{fill:#6a1010;font-style:normal;font-size:9px;letter-spacing:.08em;font-weight:bold;}
.m-lbl.city{fill:#0a1a2a;font-size:9px;}
.m-city{fill:#0a1a2a;animation:mPulse 2s ease-in-out infinite;}
@keyframes mPulse{0%,100%{r:3;opacity:1}50%{r:5;opacity:.4}}
.m-enemy{fill:#8b1010;opacity:0;transition:opacity .4s ease 1.6s;}
.m-enemy.show{opacity:1;}

/* Invasion arrows - ink bleed */
.inv{
  stroke:#8b1010;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:280;stroke-dashoffset:280;
  transition:stroke-dashoffset 2s cubic-bezier(.22,1,.36,1);
}
.inv.draw{stroke-dashoffset:0;}
.inv-h{fill:#8b1010;opacity:0;transition:opacity .4s ease 1.8s;}
.inv-h.draw{opacity:1;}

/* Victory arrows */
.vic{
  stroke:#2a6040;stroke-width:2.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:200;stroke-dashoffset:200;
  transition:stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1);
}
.vic.draw{stroke-dashoffset:0;}
.vic-h{fill:#2a6040;opacity:0;transition:opacity .4s ease 1.2s;}
.vic-h.draw{opacity:1;}

/* ══════════════════════════════════════
   CHOICE INTERACTION
══════════════════════════════════════ */
.choice-wrap{margin-top:1.4rem;display:flex;flex-direction:column;gap:9px;}
.ch-opt{
  display:flex;align-items:center;gap:11px;padding:11px 15px;
  background:rgba(255,255,255,.025);border:1px solid rgba(200,184,154,.1);
  border-radius:4px;cursor:pointer;transition:all .22s;
  font-family:var(--fb);font-size:.82rem;color:var(--off-w);text-align:left;width:100%;
}
.ch-opt:hover{background:rgba(200,184,154,.05);border-color:rgba(200,184,154,.25);}
.ch-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.ch-ans{
  margin-top:11px;padding:13px 15px;
  border-left:3px solid var(--gold);background:rgba(200,184,154,.03);
  font-family:var(--fb);font-size:.8rem;line-height:1.65;color:var(--dim);
  opacity:0;transition:opacity .5s ease;border-radius:0 4px 4px 0;
}
.ch-ans.show{opacity:1;}
.ch-opt.correct{border-color:var(--dot-cit);background:rgba(123,143,224,.07);}
.ch-opt.dimmed{opacity:.28;pointer-events:none;}

</style>
</head>
<body>

<div id="pb"></div>
<div id="grain"></div>
<div id="vignette"></div>

<div id="lang-bar">
  <div id="lang-toggle">
    <button class="lb on" onclick="setLang('en')">EN</button>
    <button class="lb" onclick="setLang('jp')">日本語</button>
  </div>
</div>

<nav id="tl"></nav>
<main id="main"></main>

<script>
/* ══════════════════════════════════════════════════════════
   ████████╗██████╗ ██╗   ██╗███████╗████████╗    ███████╗██████╗ ██╗████████╗
      ██╔══╝██╔══██╗██║   ██║██╔════╝╚══██╔══╝    ██╔════╝██╔══██╗██║╚══██╔══╝
      ██║   ██████╔╝██║   ██║███████╗   ██║       █████╗  ██║  ██║██║   ██║
      ██║   ██╔══██╗██║   ██║╚════██║   ██║       ██╔══╝  ██║  ██║██║   ██║
      ██║   ██║  ██║╚██████╔╝███████║   ██║       ███████╗██████╔╝██║   ██║
      ╚═╝   ╚═╝  ╚═╝ ╚═════╝ ╚══════╝   ╚═╝       ╚══════╝╚═════╝ ╚═╝   ╚═╝

   ALL STORY CONTENT LIVES HERE. Edit anything in this block.
   Code below "BUILD ENGINE" is not for editing.
══════════════════════════════════════════════════════════ */

/* ── BACKGROUND IMAGES ──
   Using Unsplash (free hotlink, photographer credit below)
   Format: images.unsplash.com/photo-{ID}?w=1600&q=85&fit=crop
   ─────────────────────────────────────────────────────── */
const BG = {
  // Dark atmospheric backgrounds (Unsplash, free to hotlink)

}

/* ── SCORE BLOCK BUILDER ── */
function mkScoreBlock(key, inclLabel){
  const d = SCORES[key];
  const wrap = el('div','sc-block');
  if(inclLabel){
    const lbl=el('div','a-fact'); txt(lbl, d.lbl.en, d.lbl.jp); lbl.style.marginBottom='10px';
    wrap.appendChild(lbl);
  }
  d.rows.forEach(row => {
    const r=el('div','sc-row');
    const ln=el('span','sc-lbl '+row.k); txt(ln, {in:'THEMSELVES',cit:'CITIZENS',hum:'ALL HUMANS'}[row.k], {in:'権力者自身',cit:'市民',hum:'全人類'}[row.k]);
    const num=el('span','sc-num '+row.k); num.textContent='0'; num.dataset.target=row.v;
    const trk=el('div','sc-trk'); const fill=el('div','sc-fill '+row.k); fill.dataset.target=row.v; trk.appendChild(fill);
    r.appendChild(ln); r.appendChild(num); r.appendChild(trk);
    if(row.delta!==undefined){
      const d=el('span','sc-delta '+(row.delta<0?'neg':'pos'));
      d.textContent=(row.delta>0?'+':'')+row.delta; r.appendChild(d);
    }
    wrap.appendChild(r);
  });
  return wrap;
}

/* ── ANNOTATION CARD BUILDER ── */
function mkCard(stop, scIdx, si){
  const card = el('div','anno-card'); card.id='card-'+scIdx+'-'+si;
  const inner = el('div','anno-inner');

  const langData = stop[lang]||stop.en;
  const jpData   = stop.jp||stop.en;
  const enData   = stop.en;

  // Tag
  const tag=el('div','a-tag'); txt(tag, enData.tag, jpData.tag); inner.appendChild(tag);

  // Headline
  const head=el('h2','a-head');
  txt(head, enData.h.replace(/\n/g,'<br>'), jpData.h.replace(/\n/g,'<br>'));
  inner.appendChild(head);

  // Dot defs (before score reveal in Before chapter)
  if(stop.dotDefs){
    const dw=el('div','dot-defs');
    DOT_DEFS.forEach((d,di)=>{
      const it=el('div','dd-item');
      const c=el('div','dd-circ '+d.k);
      const tx=el('div');
      const nm=el('div','dd-name'); txt(nm,d.en.nm,d.jp.nm);
      const df=el('div','dd-def'); txt(df,d.en.df,d.jp.df);
      tx.appendChild(nm); tx.appendChild(df);
      it.appendChild(c); it.appendChild(tx); dw.appendChild(it);
    });
    inner.appendChild(dw);
  }

  // Body
  if(enData.body && !stop.names){
    const b=el('p','a-body'); txt(b, enData.body, jpData.body); inner.appendChild(b);
  }

  // Names list
  if(stop.names){
    const nl=el('div','names');
    NAMES.forEach(n=>{
      const r=el('div','name-row'+(n.x?' x':'')+(n.hi?' hi':''));
      const dt=el('span','name-dt'); dt.textContent=n.dt;
      const nm=el('span','name-nm'); nm.textContent=n.nm;
      r.appendChild(dt); r.appendChild(nm);
      if(n.note){const nt=el('span','name-note');nt.textContent='— '+n.note;r.appendChild(nt);}
      nl.appendChild(r);
    });
    inner.appendChild(nl);
  }

  // Scores
  if(stop.scores){
    inner.appendChild(mkScoreBlock(stop.scores, true));
  }

  // Fact
  if(enData.fact && !stop.scores){
    const f=el('p','a-fact'); txt(f, enData.fact, jpData.fact); inner.appendChild(f);
  }

  card.appendChild(inner);
  return card;
}

/* ── MAIN BUILD ── */
STORY.forEach((sc, scIdx) => {

  /* FULLSCREEN */
  if(sc.type==='fullscreen'){
    const s=el('section','fs'); s.dataset.ch=sc.ch; s.dataset.sci=scIdx;
    const bg=el('div','fs-bg'); 
    bg.style.backgroundImage=`url('${sc.bg}')`;
    s.appendChild(bg);

    // Hook: full-bleed art behind bg
    if(sc.art){
      const artDiv=el('div'); artDiv.style.cssText='position:absolute;inset:0;z-index:1;overflow:hidden;';
      const img=el('img'); img.src=sc.art; img.loading='lazy';
      img.style.cssText='width:100%;height:100%;object-fit:cover;opacity:0.25;filter:sepia(.4) contrast(.85);';
      artDiv.appendChild(img); s.appendChild(artDiv);
    }

    const inner=el('div','fs-inner');
    inner.style.cssText='position:relative;z-index:10;';
    const d=sc.en;
    if(d.ol){const e=el('span','overline sr');e.dataset.d=0;txt(e,d.ol,sc.jp.ol);inner.appendChild(e);}
    if(d.h){const e=el('h1','h-giant sr');e.dataset.d=1;txt(e,d.h,sc.jp.h);inner.appendChild(e);}
    if(d.sub){const e=el('p','h-sub sr');e.dataset.d=2;txt(e,d.sub.replace(/\n/g,'<br>'),sc.jp.sub.replace(/\n/g,'<br>'));inner.appendChild(e);}
    if(d.lines){
      d.lines.forEach((ln,li)=>{const e=el('p','l-line sr');e.dataset.d=li%5;txt(e,ln,sc.jp.lines[li]);inner.appendChild(e);});
      // Choice
      const qp=el('p','l-line sr'); qp.dataset.d=d.lines.length%5; txt(qp,CHOICE.q.en,CHOICE.q.jp); inner.appendChild(qp);
      const cw=el('div','choice-wrap sr'); cw.dataset.d=(d.lines.length+1)%5;
      CHOICE.opts.forEach(opt=>{
        const btn=el('button','ch-opt'); btn.id='co-'+opt.k; btn.onclick=()=>pickChoice(opt.k);
        const dot=el('div','ch-dot'); dot.style.background=opt.k==='in'?'var(--dot-in)':opt.k==='cit'?'var(--dot-cit)':'var(--dot-hum)';
        const sp=el('span'); txt(sp,opt.en,opt.jp); btn.appendChild(dot); btn.appendChild(sp); cw.appendChild(btn);
      });
      const ans=el('div','ch-ans'); ans.id='ch-ans'; cw.appendChild(ans);
      inner.appendChild(cw);
      const lq=el('p','l-q sr'); lq.dataset.d=(d.lines.length+2)%5; txt(lq,d.q,sc.jp.q); inner.appendChild(lq);
    }
    s.appendChild(inner);
    if(sc.scrollHint){
      const h=el('div','scroll-cue');
      h.innerHTML='<span data-en="scroll" data-jp="スクロール">scroll</span><div class="sc-line"></div>';
      s.appendChild(h);
    }
    main.appendChild(s);

  /* EXHIBIT */
  } else if(sc.type==='exhibit'){
    const ch=el('div','ch'); ch.dataset.ch=sc.ch; ch.dataset.sci=scIdx; ch.dataset.type='exhibit';
    ch.style.height=(sc.stops.length * STOP_H() + window.innerHeight)+'px';

    const stage=el('div','sticky-stage');
    const bgDiv=el('div','ch-bg'); bgDiv.style.backgroundImage=`url('${sc.bg}')`;
    stage.appendChild(bgDiv);

    // Artifact
    const af=el('div','artifact-frame');
    const ai=el('img','artifact-img'); ai.src=sc.art; ai.alt='artifact'; ai.loading='lazy';
    af.appendChild(ai);

    // Side images
    sc.stops.forEach((stop,si)=>{
      if(!stop.side) return;
      const img=el('img','side-img side-'+stop.side.pos); 
      img.src=stop.side.src; img.loading='lazy';
      img.id='si-'+scIdx+'-'+si; af.appendChild(img);
    });
    stage.appendChild(af);

    // Spotlight
    const sp=el('div','spotlight'); sp.id='sp-'+scIdx; stage.appendChild(sp);

    // Anno cards
    sc.stops.forEach((stop,si)=>{
      const layer=el('div','anno-layer'); layer.id='al-'+scIdx+'-'+si;
      const card=mkCard(stop, scIdx, si); layer.appendChild(card); stage.appendChild(layer);
    });

    ch.appendChild(stage); main.appendChild(ch);

  /* MAP */
  } else if(sc.type==='map'){
    const ch=el('div','ch'); ch.dataset.ch=sc.ch; ch.dataset.sci=scIdx; ch.dataset.type='map';
    ch.style.height=(sc.stops.length * STOP_H() + window.innerHeight)+'px';

    const stage=el('div','sticky-stage');
    const bgDiv=el('div','ch-bg'); bgDiv.style.backgroundImage=`url('${sc.bg}')`;
    stage.appendChild(bgDiv);

    // Map
    const ma=el('div','map-art');
    const mw=el('div','map-wrap'); mw.appendChild(mkMap()); ma.appendChild(mw); stage.appendChild(ma);

    // Anno cards
    sc.stops.forEach((stop,si)=>{
      const layer=el('div','anno-layer'); layer.id='al-'+scIdx+'-'+si;
      const card=mkCard(stop, scIdx, si); layer.appendChild(card); stage.appendChild(layer);
    });

    ch.appendChild(stage); main.appendChild(ch);

  /* HANDOFF */
  } else if(sc.type==='handoff'){
    const s=el('section','fs'); s.dataset.ch=sc.ch;
    const bg=el('div','fs-bg'); bg.style.backgroundImage=`url('${sc.bg}')`; s.appendChild(bg);

    const d=sc.en;

    intr.dataset.d=0; txt(intr,d.intro,sc.jp.intro); 
    const pips=el('div','pips sr'); pips.dataset.d=1;
    for(let i=0;i<6;i++){const p=el('div','pip'+(i===0?' on':'')); pips.appendChild(p);}
    const title=el('h2','hf-t sr'); title.dataset.d=2; txt(title,d.title.replace(/\n/g,'<br>'),sc.jp.title.replace(/\n/g,'<br>'));
    const body=el('p','hf-b sr'); body.dataset.d=3; txt(body,d.body.replace(/\n/g,'<br>'),sc.jp.body.replace(/\n/g,'<br>'));
    const btn=el('a','go-btn sr'); btn.dataset.d=4; btn.href='#';
    const bs=el('span'); txt(bs,d.btn,sc.jp.btn); const ba=el('span','go-arr'); ba.textContent='→';
    btn.appendChild(bs); btn.appendChild(ba);
    inner.appendChild(intr); inner.appendChild(pips); inner.appendChild(title);
    inner.appendChild(body); inner.appendChild(btn); s.appendChild(inner); main.appendChild(s);
  }
});

/* ══════════════════════════════════════════════════════════
   LENIS SMOOTH SCROLL
   Heavy museum physics: lerp 0.05, duration 1.8s
══════════════════════════════════════════════════════════ */
const lenis = new Lenis({
  duration: 1.8,
  easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
  smoothWheel: true,
  wheelMultiplier: 0.85,
});

lenis.on('scroll', onScroll);

function raf(time){ lenis.raf(time); requestAnimationFrame(raf); }
requestAnimationFrame(raf);

/* ══════════════════════════════════════════════════════════
   SCROLL HANDLER — scrub-based, tied to position
══════════════════════════════════════════════════════════ */
function onScroll({ scroll, limit }){
  // Progress bar
  document.getElementById('pb').style.width = (scroll/limit*100)+'%';

  const vh = window.innerHeight;
  let activeChapter = '';

  // Fullscreen scenes
  main.querySelectorAll('.fs').forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    const bottom = top + sec.offsetHeight;
    const entering = top < vh*.78 && bottom > vh*.18;
    sec.querySelectorAll('.sr').forEach(e => {
      e.classList.toggle('in', entering);
      if(!entering && bottom < vh*.1) e.classList.add('out');
      else e.classList.remove('out');
    });
    if(top < vh*.65 && bottom > vh*.35) activeChapter = sec.dataset.ch;
  });

  // Exhibit + map chapters
  main.querySelectorAll('.ch').forEach(ch => {
    const rect = ch.getBoundingClientRect();
    const scrollInCh = -rect.top; // how far we've scrolled into this chapter
    const stopH = STOP_H();
    const stopIdx = Math.max(0, Math.min(Math.floor(scrollInCh / stopH), 10));
    const sci = parseInt(ch.dataset.sci);
    const sc = STORY[sci];
    if(!sc||!sc.stops) return;
    const clamp = Math.min(stopIdx, sc.stops.length-1);

    if(rect.top < vh*.6 && rect.bottom > vh*.4) activeChapter = ch.dataset.ch;

    sc.stops.forEach((_,si)=>{
      const card = document.getElementById('card-'+sci+'-'+si);
      if(card){
        const active = si===clamp;
        card.classList.toggle('on', active);
        if(active){
          const sb = card.querySelector('[data-score-key]')||card.querySelector('.sc-block');
          if(sb && sb.dataset.scoreKey){
            const uid=sci+'-'+si+'-'+sb.dataset.scoreKey;
            if(!scored.has(uid)){scored.add(uid);animateScores(sb,sb.dataset.scoreKey);}
          }
        }
      }
    });

    // Spotlight
    const spEl = document.getElementById('sp-'+sci);
    if(spEl && sc.stops[clamp]?.sp){
      const s=sc.stops[clamp].sp;
      spEl.style.cssText=`left:calc(${s.x} - ${s.w/2}px);top:calc(${s.y} - ${s.h/2}px);width:${s.w}px;height:${s.h}px;opacity:1;`;
      spEl.classList.add('on');
    }

    // Side images
    sc.stops.forEach((stop,si)=>{
      if(!stop.side) return;
      const img = document.getElementById('si-'+sci+'-'+si);
      if(img) img.classList.toggle('show', si===clamp);
    });

    // Map state
    if(sc.type==='map' && sc.stops[clamp]){
      setMapState(sc.stops[clamp].mapState);
    }
  });

  updateTL(activeChapter);
}

/* ── MAP STATE ── */
function setMapState(state){
  if(state===mapState) return;
  mapState=state;
  const draw = id => document.getElementById(id)?.classList.add('draw');
  const undraw = id => { const e=document.getElementById(id); if(e){e.classList.remove('draw');} };
  const show = id => { const e=document.getElementById(id); if(e){e.classList.add('show');e.style.opacity='1';} };

  if(state==='clean'){
    ['inv-p','inv-a','invh-p','invh-a'].forEach(undraw);
    ['vic-ne','vic-e','vic-s','vich-ne','vich-e','vich-s'].forEach(undraw);
    ['me-0','me-1'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.opacity='0';});
    ['mel-0','mel-1'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.opacity='0';});
  }
  if(['invasion','committee','victory','creep'].includes(state)){
    setTimeout(()=>{draw('inv-p');draw('invh-p');show('me-0');show('mel-0');},100);
    setTimeout(()=>{draw('inv-a');draw('invh-a');show('me-1');show('mel-1');},700);
  }
  if(['victory','creep'].includes(state)){
    ['vic-ne','vic-e','vic-s'].forEach((id,i)=>setTimeout(()=>draw(id),i*350));
    setTimeout(()=>['vich-ne','vich-e','vich-s'].forEach(draw), 1100);
  }
}

/* ── SCORE ANIMATION ── */
function animateScores(block, key){
  SCORES[key].rows.forEach((row,i)=>{
    setTimeout(()=>{
      const nums = block.querySelectorAll('.sc-num');
      const fills = block.querySelectorAll('.sc-fill');
      if(nums[i]) countUp(nums[i], row.v, 1400);
      if(fills[i]) setTimeout(()=>{ fills[i].style.width=row.v+'%'; },80);
    }, i*560);
  });
}
function countUp(el,target,dur){
  const t0=performance.now();
  (function f(now){
    const p=Math.min((now-t0)/dur,1);
    el.textContent=Math.round((1-Math.pow(1-p,3))*target);
    if(p<1) requestAnimationFrame(f); else el.textContent=target;
  })(t0);
}

/* ── TIMELINE ── */
let lastCh='';
function updateTL(active){
  if(active===lastCh) return; lastCh=active;
  const idx=CHS.findIndex(c=>c.id===active);
  CHS.forEach((ch,i)=>{
    document.getElementById('tld-'+ch.id)?.classList.toggle('on',i===idx);
    document.getElementById('tld-'+ch.id)?.classList.toggle('done',i<idx);
    document.getElementById('tll-'+ch.id)?.classList.toggle('on',i===idx);
    const cf=document.getElementById('tlcf-'+ch.id);
    if(cf) cf.style.height=i<idx?'100%':i===idx?'50%':'0%';
  });
}

/* ── LANGUAGE ── */
function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',b.textContent.trim()===(l==='en'?'EN':'日本語')));
  document.querySelectorAll('[data-en]').forEach(e=>{
    const v=e.getAttribute('data-'+l); if(v!==null) e.innerHTML=v;
  });
}

/* ── CHOICE ── */
function pickChoice(k){
  if(choiceMade) return; choiceMade=true;
  const opt=CHOICE.opts.find(o=>o.k===k);
  CHOICE.opts.forEach(o=>{
    const b=document.getElementById('co-'+o.k); if(!b) return;
    if(o.correct) b.classList.add('correct');
    else if(o.k!==k) b.classList.add('dimmed');
    b.style.pointerEvents='none';
  });
  const ans=document.getElementById('ch-ans');
  if(ans){ans.textContent=opt.ans[lang]||opt.ans.en; ans.classList.add('show');}
}

/* ── RESIZE ── */
window.addEventListener('resize',()=>{
  main.querySelectorAll('.ch[data-type]').forEach(ch=>{
    const sci=parseInt(ch.dataset.sci);
    const sc=STORY[sci];
    if(sc?.stops) ch.style.height=(sc.stops.length*STOP_H()+window.innerHeight)+'px';
  });
});

/* ── INIT ── */
window.addEventListener('load',()=>{
  setLang('en');
  // First scene in
  setTimeout(()=>{
    document.querySelectorAll('.fs:first-child .sr').forEach((e,i)=>{
      setTimeout(()=>e.classList.add('in'),500+i*180);
    });
  },200);
  // Mark score blocks with their key for detection
  document.querySelectorAll('.sc-block').forEach(b=>{
    const card=b.closest('.anno-card'); if(!card) return;
    const id=card.id; // card-scIdx-si
    const parts=id.split('-');
    const sci=parseInt(parts[1]); const si=parseInt(parts[2]);
    const sc=STORY[sci]; if(!sc?.stops?.[si]?.scores) return;
    b.dataset.scoreKey=sc.stops[si].scores;
  });
});
</script>
